x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    command: tunnel --no-autoupdate run
    env_file:
      - ./secrets/cloudflared.env
    restart: unless-stopped
    logging: *logging
