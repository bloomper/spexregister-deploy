services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    networks:
      - app_network
      - keycloak_network

  keycloak:
    depends_on:
      mailpit:
        condition: service_started

volumes:
  mailpit_data:
