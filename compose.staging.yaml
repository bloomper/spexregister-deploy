x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mail:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    logging: *logging
    volumes:
      - mail_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    networks:
      - api_network
      - auth_network

  auth:
    depends_on:
      mail:
        condition: service_started

volumes:
  mail_data:
